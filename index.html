<div class="card full"><h3>Title</h3><p class="big">“Boule de Suif”</p></div>
<div class="card"><h3>Setting</h3><p><b>When:</b> Winter, 1870–71, during the Franco-Prussian War.</p><p><b>Where:</b> Normandy, France: a cramped carriage leaving Rouen in a snowstorm, then an inn in Tôtes.</p></div>
<div class="card"><h3>Characters</h3><p><b>Protagonist:</b> Boule de Suif, kind, generous and patriotic, yet despised as a prostitute.</p><p><b>Antagonist:</b> the “respectable” passengers: a wine merchant, a factory owner, a count and their wives.</p></div>
<div class="card full"><h3>Plot / Events</h3><ol><li><b>Beginning:</b> Passengers flee Rouen; the “respectable” ones snub Boule de Suif.</li><li><b>Rising action:</b> She shares her food, and they warm up to her.</li><li class="hi"><b>Climax:</b> At the inn, a Prussian officer demands she sleep with him, and the others pressure her.</li><li><b>Ending:</b> She yields, then they shun her and refuse her food.</li></ol></div>
<div class="card full dark"><h3>Theme</h3><p class="big">Society’s “respectable” people are often selfish hypocrites, while the person they despise may be the one with real kindness and integrity.</p></div></div>`;
const STEAL=`<div class="grid2">
<div class="card"><h3>S · Speech</h3><p>Sent to the officer through the innkeeper: “I shall never change it; you understand, never, never, never!”</p><p>The ladies stay “amiable toward her” only “to increase her docility.”</p></div>
<div class="card"><h3>T · Thought</h3><p>Believes the enemy deserves her hatred; her patriotism is felt, not performed.</p><p>Believes in her dignity: she will run from the war, but not be humiliated by the enemy.</p></div>
<div class="card"><h3>E · Effect on Others</h3><p>Snubbed, welcomed when she shares, pressured, then shunned.</p><p>The group treats her “like some improper or useless article.”</p></div>
<div class="card"><h3>A · Actions</h3><p>Flees Rouen to survive, shares her basket, refuses the officer.</p><p><b>Change:</b> from generous and defiant to worn down and silent.</p></div>
<div class="card"><h3>L · Looks</h3><p>Plump and round: “Ball of Fat” reduces her to a body.</p><p>Mocked for her looks, yet her body and food sustain everyone.</p></div>
<div class="card dark"><h3>My claim (X, Y, Z)</h3><p>As shown by her speech, her actions, and the way others treat her, Boule de Suif exhibits a genuine patriotism and moral integrity that contrast with the calculated hypocrisy of those around her.</p></div></div>`;

<div class="grid2">
<div class="card dark"><h3>Internal conflict (man vs. self)</h3><p>During the rising action, Boule de Suif is torn between her patriotic pride and dignity and her wish to help the stranded group and stop being blamed.</p></div>
<div class="card dark"><h3>External conflict (man vs. society)</h3><p>During the rising action, she faces the “respectable” passengers, who flatter and pressure her, and the Prussian officer who traps the coach.</p></div>
<div class="card"><h3>1 · Exposition</h3><p>Winter, 1870–71, during the Franco-Prussian War. Ten travelers flee Rouen by coach in a snowstorm. The “respectable” passengers snub Boule de Suif, a prostitute, and the main conflict appears: an outcast among people who judge her.</p></div>
<div class="card"><h3>2 · Rising action</h3><p>Stranded and hungry, the group accepts her food; the Count says, “We accept with gratitude, Madame” (Maupassant, n.d., chap. 6). At the inn in Tôtes, a Prussian officer refuses to let the coach leave unless she sleeps with him. She refuses, and the others begin to pressure her.</p></div>
<div class="card"><h3>3 · Climax</h3><p>The group’s flattery and arguments finally wear her down, and she gives in to the officer. This is the turning point: once she yields, everything goes terribly wrong and the ending becomes inevitable.</p></div>
<div class="card"><h3>4 · Falling action</h3><p>The coach is allowed to leave. The passengers who begged her for help now shun her, and they take out their own food and eat while she has none.</p></div>
<div class="card full"><h3>5 · Resolution</h3><p>The journey continues. She weeps in silence, treated “like some improper or useless article” (Maupassant, n.d., chap. 13). The hypocrisy goes unpunished, and the outcast remains an outcast.</p></div></div>`;

const INTRO=`<h3>Introduction</h3><p>In-depth reading of <i>Boule de Suif</i> (Ball of Fat) has benefited me greatly. I have loved Maupassant’s works since I was a child, and this story left a deep impression on me, so when it came to choosing a text for literary analysis, it was the first thing that came to mind. At first, I thought doing the assignments this way would be easy. But as I completed each one, I gradually came to appreciate the story’s charm more deeply and became more aware of the importance of literary analysis.</p><p>People naturally feel compassion for those at the bottom of society, and with the author’s deliberate guidance, it is easy to be swept away by this slogan-like pity: to empathize with the protagonist and stand up for her. I used to be like that too. Before starting the assignments, I roughly reread the story and summarized the conventional conclusions about Boule de Suif’s patriotism, strength, and kindness—the kind of labels one can easily draw from the text.</p><p>But one afternoon, I started talking with my teacher about this work. He asked me, “Was Boule de Suif really patriotic?” I naturally answered yes, because she had fought a Prussian soldier and insisted on resisting the officer. “But she gave in,” the teacher said. At that moment, I wavered. I could not find more evidence of her patriotism. Emotional pity made me want to defend her, but reason told me it was far from enough. She gave in and was condemned by her companions. I wanted to say she had no choice, but if someone (like those brave patriots on TV) truly loved their country, would she give in? “I don’t know” that was all I could say.</p><p>After that, I began to read more deeply, hoping to find some clue in my favor in this brief plot. She had done so little, and the story was ridiculously short—why had I chosen it? At this point, I began to blame the author: why did Maupassant write about her? Was it just to promote her righteousness and accuse those who were shameless on the journey? If that was all, why did he let Boule de Suif end up like that?</p><p>Story maps, S.T.E.A.L. diagrams, plot diagrams… As I completed these assignments, I read the story in more detail, found more evidence for her actions, and gained a deeper understanding of the plot. I grasped the symbolic meaning of the basket, summarized the irony behind the story, and, most importantly, finally understood Maupassant. Boule de Suif is an underdog. She is so small and humble that both her social status and her personality are marginalized. She cannot fight like those heroes; she retains the ordinary human instinct to seek benefit and avoid harm. What Maupassant actually wants to show is the brilliance people hold subconsciously, like a diamond. It is precisely because they are underdogs that they can hold onto their beliefs at the cost of their own interests; precisely because they are underdogs, they ultimately compromise with the majority; and precisely because they are underdogs, they have such pure dignity—a dignity that people of higher status can put on and take off at will, while she cannot.</p><p>I admire underdogs, and for that reason I have grown even fonder of Boule de Suif. As for that question, this assignment and my research have also given me an answer. She did compromise. But that is precisely what proves the darkness of society and the significance of her marginalization as a small, powerless figure!</p><p>She was patriotic. I am firmly convinced.</p>`;
const ABOUT=`<h3>About me</h3><p>I am an ordinary student who just loves reading, writing, and drawing. For me, reading is a quiet way to escape reality, writing is how I organize my messy thoughts, and drawing is simply a hobby that makes me happy.</p><p>When I first chose <i>Boule de Suif</i> for this project, I thought it would be easy because it’s such a short story. But it turned out to be much harder than I expected. I struggled to answer my teacher’s question about whether the protagonist was truly patriotic. Through the process of making story maps, drawing diagrams, and writing essays, I learned that literary analysis isn’t just about saying “this character is good” or “that character is bad.” It requires looking closely at the text and questioning my own first impressions.</p><p>I am still a beginner in literary analysis, but this portfolio records my honest journey with this story. I hope you can see my efforts in these pages, and I also hope you enjoy reading them.</p>`;
const S_T=`<h3>Text</h3><p><i>Boule de Suif</i> by Guy de Maupassant takes place in the winter of 1870–71, during the Franco-Prussian War, as a group of travelers flee Rouen in a crowded carriage. The protagonist, Boule de Suif, is a kind and patriotic prostitute whom the “respectable” passengers look down on, and these same passengers become the antagonists of the story. When the travelers grow hungry, she generously shares her food, and for a moment they treat her warmly. The climax comes at an inn, where a Prussian officer refuses to let the carriage leave unless she sleeps with him. She refuses at first, but the others pressure and manipulate her until she gives in. In the end, once the journey continues, the same people who begged her to help treat her with contempt and will not share their food with her. Through this story, Maupassant shows that society’s “respectable” people are often selfish hypocrites, while the person they despise may be the one with real kindness and integrity.</p>`;
const S_R=`<h3>My reflection</h3><p>By creating a story map, I gained a more detailed understanding of the time and place of the whole story. Delving into the story is really a completely different feeling compared to reading it just for fun. For example, when you read casually, you wouldn’t pay attention to where the story takes place at all. By checking the map, I learned that Rouen is in the northwest of France, and that when the characters left Rouen, they were moving away from areas occupied by the Prussians. Having this information helps you better understand the characters’ actions and psychology. Story maps are truly a fundamental and indispensable part of literary analysis!</p>`;
const C_T=`<h3>Text</h3><p>Boule de Suif sits at the bottom of the social order, and the “respectable” passengers never let her forget it. What separates her is not better morals. Her loyalty to her country is something she feels immediately and never calculates, while the others’ patriotism is a mood they put on and take off.</p><p>Her speech shows her loyalty is not reasoned. She leaves Rouen to survive, and so does everyone else, so flight is not what sets her apart. What does her answer when the innkeeper asks whether she has changed her mind about the Prussian officer: “I shall never change it; you understand, never, never, never!” (Maupassant, 1911, Chap. 10). The repeated “never” does not sound like an argument; it sounds like a feeling that comes out before she can turn it into reasons. By the next morning, the same travelers who had been angry at the officer “almost wished now that the Prussian had secretly found this girl” (Chap. 10). The narrator reports this as their private thought, not something said aloud, which makes it worse: their patriotism vanishes once it costs them something, and it vanishes quietly. Hers does not, because for her it was never a calculation. The passengers never argue about whether the officer’s demand is right; they argue only about whether refusing is convenient. Their patriotism has no content. Hers has no argument behind it either, which is why they cannot talk her out of it.</p><p>Her refusal also shows her loyalty is tied to her body and her shame, not a theory. When the officer demands she sleep with him, she refuses and keeps refusing even though the group is stuck because of her. Her resistance is not a principle weighed against the group’s wishes; it is closer to a disgust she cannot talk herself out of. Her profession matters. A woman who sells her body might be expected to treat it as tradable, yet she is the one who refuses to trade it for the group’s comfort. The “respectable” ladies, who would never sell themselves, calmly suggest she should. They stay “amiable toward her” only “to increase her docility,” and at lunch they mention famous women who made “a battlefield of their bodies” (Chap. 10). The example flatters her into seeing herself as heroic, but it also admits what they will not say outright: they are asking her to do exactly what they call shameful in her. They need to be tradable, so their own comfort does not have to be. Maupassant turns the usual hierarchy upside down: the woman called “immoral” is the only one who treats her body as something that cannot be handed over.</p><p>The others then try to talk her out of it. They begin with a religious argument that a bad act can be excused by a good purpose, making self-interest sound like duty; then pressure turns to flattery, and the ladies’ stories are the flattery at its most patient: they dress up the demand as heroism so she will stop resisting it. When she finally “said nothing,” she just listened to those stories and the religious reasoning, and her silence is not agreement. It is the moment she stops trying to answer them, because their logic is not something she can argue with. She cannot argue back, because her loyalty was never an argument, and this inability to calculate is exactly what they exploit.</p><p>The way they treat her shows what her instinct costs. Her plump figure gives her the nickname, reducing her to a body, a resource to use and throw away. When they are hungry, her food keeps them going; after she gives in, they take out their own provisions and eat while she sits in tears. Her body and her food together show how comfortable they use the vulnerable and stop caring once they are no longer useful. Maupassant is not saying she is morally better in a sermon’s sense. He shows that the one society calls “immoral” is the only one who cannot stop feeling, and that this is exactly what makes it easy to use.</p><p>The last scene returns to the food, and that return is the point. The passengers who once ate her provisions now eat their own and leave her with nothing, and her tears are the only answer she has left. Maupassant does not ask us to admire her; he asks us to notice what the coach has done to her. She fled the battlefield of Rouen, but she is the only character who never learned to switch her heart off, and that is why she is destroyed.</p>`;
const C_R=`<h3>My reflection</h3><p>Compared with a story map, the S.T.E.A.L. diagram makes me focus more on the characters. The part I find challenging is deciding which of the protagonist’s actions to include in the analysis. Since the analysis is limited, I can only pick out the most striking lines. Also, her struggles aren’t described in detail: the author doesn’t spend much time on the main character. So, I chose the passengers’ actions and dialogues as a contrast to reflect the protagonist’s traits. I used to do character analyses a lot in high school, but what’s unique about this chart is the <i>E</i> part. I had never really thought about how her actions affect others, which opened a new perspective for my future reading.</p>`;
const P_T=`<h3>Text</h3><p>Guy de Maupassant’s Boule de Suif deserves a nomination because it turns a single carriage ride into a precise argument about hypocrisy. Its logical structure of evidence rests on the passengers’ shifting attitudes toward the protagonist: at first they look down on her; when she shares her food, they grow warm; when the carriage is detained, they flatter and persuade her, disguising selfish demands as patriotic duty; and once she yields, they treat her with a coldness even harsher than at the start. The climax, where the group pressures her to give in, is the turning point, because it exposes her plight: she is trapped between her personal morality and the group’s collective hypocrisy. Maupassant sharpens this conflict with irony, since the people who preach sacrifice are the ones who demand it from someone else, and with symbolism, since her food basket, which first buys their friendship, shows how they use her and then discard her. In the final scene, the narrator says they reject her “like some improper or useless article” (Maupassant, 1911, chap. 13), a simile that reduces her to an object. Together, the climax and her plight develop the theme: society’s “respectable” people often wear morality like a removable coat, while the person they despise may be the only one with real integrity.</p>`;
const P_R=`<h3>My reflection</h3><p>Actually, when I was making the plot diagram, I was really conflicted about which part of the story to put the climax on. The whole novel leans more toward a linear narrative. In most other novels, the conflict is usually the climax, but in this story, the conflict is divided into two parts: the conflict between the protagonist and the Prussian officer, and the conflict between the protagonist and the passengers. Looking at the whole journey, the former should be the climax; but in terms of the theme, it should be the latter. But for me, the protagonist’s tragedy (being isolated and helpless, disappointed in and giving in to the other passengers) is what moves me the most. So, I chose the moment she gives in as the climax. Once the climax is set, the rest becomes pretty simple.</p>`;
const REFL=`<h3>Reflection</h3><p>When I first started this project, I thought it would be easy. The story is “ridiculously short,” and I had loved Maupassant since I was a child. I assumed the assignments would just confirm my first impressions—that Boule de Suif was simply patriotic, strong, and kind. I didn’t realize at first that I was just repeating the “labels one can easily draw from the text.” I even started to blame the author, wondering why he made the story so short and left me with so little to defend her.</p><p>The real turning point happened during that afternoon conversation with my teacher. When I confidently said she was patriotic, he replied, “But she gave in.” I wavered. Just like in my Introduction, I couldn’t find enough evidence to answer him. But then I did the S.T.E.A.L. diagram. I had never really thought about the “E” part—how her actions affect others. When I reread the passengers’ speeches, I realized I had only been looking at her lines. I used to read her silence at the inn as weakness. But looking at how the others talked to her first made me see it differently: she is silent because she simply cannot argue with a logic she doesn’t share.</p><p>If my teacher asked me that question again today, I would still say yes, but now I have the exact words to prove it. I would point to her repeated “never, never, never” (Maupassant, 1911, chap. 10) in response to the enemy officer, and the final image where she is rejected “like some improper or useless article” (Maupassant, 1911, chap. 13). These lines show me that her loyalty isn’t a calculated argument, but a deeply felt instinct. In my Introduction I wrote that I am convinced she is patriotic. I still am, but the pull of “But she gave in” haunts me. The difference now is that instead of just feeling sorry for her, I can use the passengers’ actions to understand why she yields.</p><p>Next time I analyze a character, I won’t just say “this character is good” or “this character is bad.” I will look at how they affect the people around them. I will also use this method in my Nomination Essay—using the passengers’ hypocritical actions to prove who she really is, and tracing how their pressure turns her sacrifice into a transaction. Literary analysis, I have learned, is not just about having a strong emotional reaction; it is about finding the words in the text to explain that reaction.</p>`;
